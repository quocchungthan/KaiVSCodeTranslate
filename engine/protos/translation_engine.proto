// Kai translation engine RPC contract.
// The backend (server side) references this same file to generate its gRPC client.
// Every call must carry the metadata header `x-engine-key: <secret>`.
syntax = "proto3";

package kai.engine.v1;

option csharp_namespace = "Kai.Engine.Contracts.V1";

import "google/protobuf/timestamp.proto";

service TranslationEngine {
  // Client-streaming upload. First message MUST be `metadata`, followed by `chunk` messages.
  // Idempotent: re-uploading identical bytes returns the existing job (deduplicated = true).
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);

  // Status by SHA-256 (lowercase hex) returned from UploadFile.
  rpc GetJobStatus(GetJobStatusRequest) returns (JobStatus);

  // Paged listing for the gallery, newest first.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // Server-streaming download of a completed result. Resumable through `offset`.
  // First message is `header`, followed by `data` messages.
  rpc DownloadResult(DownloadResultRequest) returns (stream DownloadResultChunk);

  // Liveness/capacity probe for the backend.
  rpc GetEngineInfo(GetEngineInfoRequest) returns (EngineInfo);
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;     // accepted, waiting for its assigned agent (see queue_position)
  JOB_STATE_RUNNING = 2;    // leased by an agent run
  JOB_STATE_COMPLETED = 3;  // validated Vietnamese Markdown/PDF available
  JOB_STATE_FAILED = 4;     // retries exhausted or pipeline blocked; see message
}

enum ResultKind {
  RESULT_KIND_UNSPECIFIED = 0; // treated as PDF
  RESULT_KIND_PDF = 1;
  RESULT_KIND_MARKDOWN = 2;
}

message UploadFileRequest {
  oneof payload {
    UploadMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadMetadata {
  string file_name = 1;        // original name, used for display and the job slug
  int64 size_bytes = 2;        // declared size; verified after the stream ends
  string expected_sha256 = 3;  // optional end-to-end integrity check (lowercase hex)
  string agent_name = 4;       // optional; defaults to the engine's DefaultAgent
  string requested_by = 5;     // optional opaque backend user id, stored for audit only
}

message UploadFileResponse {
  string sha256 = 1;
  bool deduplicated = 2;
  JobStatus status = 3;
}

message GetJobStatusRequest {
  string sha256 = 1;
}

message JobStatus {
  string sha256 = 1;
  string job_id = 2;                 // pipeline job id (_processing/jobs/<job_id>), empty until initialized
  string file_name = 3;
  JobState state = 4;
  int32 queue_position = 5;          // 1-based among queued jobs of the same agent; 0 when not queued
  string assigned_agent = 6;
  int32 attempts = 7;
  string current_stage = 8;          // convert | chunk | translate | assemble | validate
  int32 chunks_completed = 9;
  int32 chunks_total = 10;
  string message = 11;
  int64 size_bytes = 12;
  bool result_available = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp started_at = 16;
  google.protobuf.Timestamp completed_at = 17;
}

message ListJobsRequest {
  JobState state_filter = 1;   // UNSPECIFIED = all
  int32 page_size = 2;         // default 50, max 200
  string page_token = 3;       // opaque; from ListJobsResponse.next_page_token
}

message ListJobsResponse {
  repeated JobStatus jobs = 1;
  string next_page_token = 2;
}

message DownloadResultRequest {
  string sha256 = 1;
  ResultKind kind = 2;
  int64 offset = 3;            // resume position in bytes
}

message DownloadResultChunk {
  oneof payload {
    DownloadHeader header = 1;
    bytes data = 2;
  }
}

message DownloadHeader {
  string file_name = 1;
  string content_type = 2;
  int64 total_size = 3;
  string sha256 = 4;           // hash of the full artifact for end-to-end verification
  int64 offset = 5;
}

message GetEngineInfoRequest {}

message EngineInfo {
  string version = 1;
  repeated string agents = 2;
  int32 queued = 3;
  int32 running = 4;
  google.protobuf.Timestamp server_time = 5;
}
